# ==================================================
# SERVER CONFIG
# ==================================================
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH}

# ==================================================
# SPRING CORE
# ==================================================
spring:
  application:
    name: ${APP_NAME}

  # -------------------------
  # DATABASE
  # -------------------------
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
      auto-index-creation: false

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT}

  # -------------------------
  # CACHE
  # -------------------------
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_TTL}

  # -------------------------
  # FILE UPLOAD
  # -------------------------
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

  # -------------------------
  # MAIL (SMTP)
  # -------------------------
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    default-encoding: ${MAIL_ENCODING}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED}
          ssl:
            enable: ${MAIL_SMTP_SSL}
            trust: ${MAIL_SMTP_SSL_TRUST}
          debug: ${MAIL_DEBUG}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT}
          timeout: ${MAIL_SMTP_TIMEOUT}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT}

# ==================================================
# SECURITY / JWT
# ==================================================
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXP}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXP}

# ==================================================
# PAYMENT GATEWAY
# ==================================================
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

# ==================================================
# NOTIFICATIONS
# ==================================================
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}
  project-id: ${FIREBASE_PROJECT_ID}

# ==================================================
# CLOUD STORAGE
# ==================================================
gcp:
  project-id: ${GCP_PROJECT_ID}
  storage-bucket: ${GCP_STORAGE_BUCKET}
  credentials-path: ${GCP_CREDENTIALS_PATH}

# ==================================================
# APPLICATION SETTINGS
# ==================================================
app:
  frontend-url: ${FRONTEND_URL}

  cors:
    allowed-origins: ${CORS_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS}
    allowed-headers: ${CORS_ALLOWED_HEADERS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED}
    requests-per-minute: ${RATE_LIMIT_RPM}

  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES}
    length: ${OTP_LENGTH}

# ==================================================
# BUSINESS RULES
# ==================================================
bidding:
  competitive-period-hours: ${BIDDING_COMPETITIVE_HOURS}
  cooling-period-hours: ${BIDDING_COOLING_HOURS}
  payment-cooling-period-hours: ${BIDDING_PAYMENT_COOLING_HOURS}
  bid-expiry-hours: ${BIDDING_EXPIRY_HOURS}
  min-vendors-for-competitive: ${BIDDING_MIN_VENDORS}
  max-bid-revisions: ${BIDDING_MAX_REVISIONS}

payment:
  token-percentage: ${PAYMENT_TOKEN_PERCENT}
  platform-fee-percentage: ${PAYMENT_PLATFORM_FEE_PERCENT}
  payment-gateway-fee-percentage: ${PAYMENT_GATEWAY_FEE_PERCENT}
  auto-refund-enabled: ${PAYMENT_AUTO_REFUND}
  payment-timeout-hours: ${PAYMENT_TIMEOUT_HOURS}

cancellation:
  window-days: ${CANCELLATION_WINDOW_DAYS}
  tiers:
    - days-before-event: ${CANCEL_TIER_1_DAYS}
      refund-percentage: ${CANCEL_TIER_1_REFUND}
    - days-before-event: ${CANCEL_TIER_2_DAYS}
      refund-percentage: ${CANCEL_TIER_2_REFUND}
    - days-before-event: ${CANCEL_TIER_3_DAYS}
      refund-percentage: ${CANCEL_TIER_3_REFUND}
    - days-before-event: ${CANCEL_TIER_4_DAYS}
      refund-percentage: ${CANCEL_TIER_4_REFUND}
    - days-before-event: ${CANCEL_TIER_5_DAYS}
      refund-percentage: ${CANCEL_TIER_5_REFUND}

# ==================================================
# LOYALTY & REFERRALS
# ==================================================
loyalty:
  points-per-rupee: ${LOYALTY_POINTS_PER_RUPEE}
  rupees-per-point: ${LOYALTY_RUPEES_PER_POINT}
  max-redeem-percentage: ${LOYALTY_MAX_REDEEM_PERCENT}
  points-expiry-days: ${LOYALTY_EXPIRY_DAYS}
  signup-bonus: ${LOYALTY_SIGNUP_BONUS}

referral:
  referrer-reward-points: ${REFERRAL_REFERRER_POINTS}
  referred-reward-points: ${REFERRAL_REFERRED_POINTS}
  enabled: ${REFERRAL_ENABLED}

# ==================================================
# FILE UPLOAD
# ==================================================
app-upload:
  path: ${UPLOAD_PATH}
  base-url: ${UPLOAD_BASE_URL}
  max-image-size-mb: ${UPLOAD_MAX_IMAGE_MB}
  max-document-size-mb: ${UPLOAD_MAX_DOC_MB}

# ==================================================
# LOGGING
# ==================================================
logging:
  level:
    root: ${LOG_ROOT_LEVEL}
    com.cateringmarketplace: ${LOG_APP_LEVEL}
    org.springframework.security: ${LOG_SECURITY_LEVEL}
    org.springframework.data.mongodb: ${LOG_MONGO_LEVEL}

# ==================================================
# ACTUATOR / MONITORING
# ==================================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE_ENDPOINTS}

# ==================================================
# API DOCS
# ==================================================
springdoc:
  api-docs:
    path: ${SWAGGER_API_DOCS_PATH}
  swagger-ui:
    path: ${SWAGGER_UI_PATH}
    enabled: ${SWAGGER_ENABLED}
    operations-sorter: ${SWAGGER_OP_SORTER}
    tags-sorter: ${SWAGGER_TAG_SORTER}
