# ==================================================
# BIDZARO CATERING PLATFORM - CONFIGURATION
# Platform: USA/India | Currencies: USD/INR
# ==================================================

# ==================================================
# SERVER CONFIG
# ==================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

# ==================================================
# SPRING CORE
# ==================================================
spring:
  application:
    name: ${APP_NAME:bidzaro-catering-platform}

  # Show detailed startup logs
  main:
    banner-mode: console
    log-startup-info: true

  # -------------------------
  # DATABASE - MONGODB
  # -------------------------
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:bidzaro_catering_platform_db}
      auto-index-creation: false

    # -------------------------
    # CACHE - REDIS
    # -------------------------
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:60000}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # -------------------------
  # CACHE
  # -------------------------
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_TTL:600000}

  # -------------------------
  # FILE UPLOAD
  # -------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:15MB}

  # -------------------------
  # MAIL (SMTP)
  # -------------------------
  mail:
    host: ${SMTP_HOST:smtp.hostinger.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: ${MAIL_ENCODING:UTF-8}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}
            trust: ${MAIL_SMTP_SSL_TRUST:smtp.hostinger.com}
          debug: ${MAIL_DEBUG:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:30000}
          timeout: ${MAIL_SMTP_TIMEOUT:30000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:30000}

# ==================================================
# SECURITY / JWT
# ==================================================
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichShouldBeVeryLongAndSecure123456789}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXP:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXP:604800000}

# ==================================================
# PAYMENT GATEWAYS
# ==================================================
# Razorpay (India - INR)
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# Stripe (USA - USD)
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# ==================================================
# NOTIFICATIONS
# ==================================================
# SMTP Email
smtp:
  from-email: ${SMTP_FROM_EMAIL:noreply@bidzaro.com}
  from-name: ${SMTP_FROM_NAME:Bidzaro Catering Platform}

# Twilio (SMS & WhatsApp)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:+14155238886}

# Firebase (Push Notifications)
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-credentials.json}
  project-id: ${FIREBASE_PROJECT_ID:}

# ==================================================
# CLOUD STORAGE (Google Cloud Platform)
# ==================================================
gcp:
  project-id: ${GCP_PROJECT_ID:}
  storage-bucket: ${GCP_STORAGE_BUCKET:}
  credentials-path: ${GCP_CREDENTIALS_PATH:gcp-credentials.json}

# ==================================================
# APPLICATION SETTINGS
# ==================================================
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  # MongoDB specific
  mongodb:
    ping-on-startup: false

  # Platform defaults - USA focused
  default-country: USA
  default-currency: USD
  location-based-features: true

  # CORS
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  # Rate Limiting
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:100}

  # OTP Configuration
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    length: ${OTP_LENGTH:6}
    log-plain: ${OTP_LOG_PLAIN:false}

# ==================================================
# BUSINESS RULES
# ==================================================
# Bidding Rules
bidding:
  competitive-period-hours: ${BIDDING_COMPETITIVE_HOURS:72}
  cooling-period-hours: ${BIDDING_COOLING_HOURS:24}
  payment-cooling-period-hours: ${BIDDING_PAYMENT_COOLING_HOURS:2}
  bid-expiry-hours: ${BIDDING_EXPIRY_HOURS:168}
  min-vendors-for-competitive: ${BIDDING_MIN_VENDORS:3}
  max-bid-revisions: ${BIDDING_MAX_REVISIONS:5}

# Payment Rules
payment:
  token-percentage: ${PAYMENT_TOKEN_PERCENT:25}
  platform-fee-percentage: ${PAYMENT_PLATFORM_FEE_PERCENT:2}
  payment-gateway-fee-percentage: ${PAYMENT_GATEWAY_FEE_PERCENT:2}
  auto-refund-enabled: ${PAYMENT_AUTO_REFUND:true}
  payment-timeout-hours: ${PAYMENT_TIMEOUT_HOURS:24}
  currency: USD

# ==================================================
# CANCELLATION POLICY
# ==================================================
cancellation:
  window-days: ${CANCELLATION_WINDOW_DAYS:30}
  tiers:
    - days-before-event: ${CANCEL_TIER_1_DAYS:30}
      refund-percentage: ${CANCEL_TIER_1_REFUND:100}
    - days-before-event: ${CANCEL_TIER_2_DAYS:15}
      refund-percentage: ${CANCEL_TIER_2_REFUND:75}
    - days-before-event: ${CANCEL_TIER_3_DAYS:7}
      refund-percentage: ${CANCEL_TIER_3_REFUND:50}
    - days-before-event: ${CANCEL_TIER_4_DAYS:3}
      refund-percentage: ${CANCEL_TIER_4_REFUND:25}
    - days-before-event: ${CANCEL_TIER_5_DAYS:0}
      refund-percentage: ${CANCEL_TIER_5_REFUND:0}

# ==================================================
# LOYALTY & REFERRALS
# ==================================================
loyalty:
  points-per-rupee: ${LOYALTY_POINTS_PER_RUPEE:1}
  rupees-per-point: ${LOYALTY_RUPEES_PER_POINT:0.25}
  max-redeem-percentage: ${LOYALTY_MAX_REDEEM_PERCENT:50}
  points-expiry-days: ${LOYALTY_EXPIRY_DAYS:365}
  signup-bonus: ${LOYALTY_SIGNUP_BONUS:100}

referral:
  referrer-reward-points: ${REFERRAL_REFERRER_POINTS:500}
  referred-reward-points: ${REFERRAL_REFERRED_POINTS:200}
  enabled: ${REFERRAL_ENABLED:true}

# ==================================================
# FILE UPLOAD
# ==================================================
app-upload:
  path: ${UPLOAD_PATH:./uploads}
  base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}
  max-image-size-mb: ${UPLOAD_MAX_IMAGE_MB:5}
  max-document-size-mb: ${UPLOAD_MAX_DOC_MB:10}

# ==================================================
# LOGGING - DETAILED FOR ALL MODULES
# ==================================================
logging:
  level:
    # Root level
    root: ${LOG_ROOT_LEVEL:INFO}

    # Application packages - DETAILED
    com.cateringmarketplace: ${LOG_APP_LEVEL:DEBUG}
    com.cateringmarketplace.module.auth: DEBUG
    com.cateringmarketplace.module.payment: DEBUG
    com.cateringmarketplace.module.notification: DEBUG
    com.cateringmarketplace.module.order: DEBUG
    com.cateringmarketplace.module.bid: DEBUG
    com.cateringmarketplace.module.vendor: DEBUG
    com.cateringmarketplace.common.filter: DEBUG

    # Spring Framework
    org.springframework.web: DEBUG
    org.springframework.security: ${LOG_SECURITY_LEVEL:INFO}
    org.springframework.boot: INFO
    org.springframework.boot.autoconfigure: INFO

    # Database - MongoDB
    org.springframework.data.mongodb: ${LOG_MONGO_LEVEL:DEBUG}
    org.mongodb.driver: INFO

    # Cache - Redis
    org.springframework.data.redis: DEBUG

    # Email/Mail
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG

    # Payment Gateways
    com.stripe: INFO
    com.razorpay: INFO

    # Notifications
    com.twilio: INFO

    # Validation
    org.hibernate.validator: INFO

  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %-40.40logger{39} : %m%n"

  file:
    name: logs/bidzaro-application.log

# ==================================================
# ACTUATOR / MONITORING
# ==================================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_EXPOSE_ENDPOINTS:health,info,metrics,prometheus}
      base-path: /actuator

  endpoint:
    health:
      show-details: always
      show-components: always

  info:
    env:
      enabled: true

# ==================================================
# API DOCUMENTATION (Swagger)
# ==================================================
springdoc:
  api-docs:
    path: ${SWAGGER_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: ${SWAGGER_OP_SORTER:method}
    tags-sorter: ${SWAGGER_TAG_SORTER:alpha}
